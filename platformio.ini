; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs =
    nodemcuv2
    vanilla_esp32
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    ; jackjansen/rc-switch -- fork of sui77/rc-switch with the pulse-timing tweaks
    ; this app relies on. See cwi-dis/iotsa-group/CLAUDE.md "Third-party forks".
    https://github.com/jackjansen/rc-switch.git
build_flags = -DWITH_HEMA -DWITH_ELRO_FLAMINGO
; build_flags = -DDEBUG_ESP_PORT=Serial -DDEBUG_ESP_CORE -DDEBUG_ESP_HTTP_CLIENT -DWITH_HEMA -DWITH_ELRO_FLAMINGO
monitor_speed = 115200
; upload_port = iotsa433.local
; upload_protocol = espota

; iotsa_v4 (ESP8266 nodemcuv2). 4m2m: 2MB filesystem, ~1MB max sketch + OTA
; scratch. The forwarder config is tiny, so 2MB FS is generous but harmless;
; kept as-is (it already supports OTA, unlike the 4m3m the other repos moved off).
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = esp8266_exception_decoder

; Build-only canary: no ESP32 433 device is deployed, but keep an ESP32 target
; compiling against develop. vanilla_esp32 tracks iotsa's current default board.
[env:vanilla_esp32]
extends = vanilla_esp32
monitor_filters = esp32_exception_decoder
